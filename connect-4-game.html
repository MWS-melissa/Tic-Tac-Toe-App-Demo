<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect 4</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #172033;
    --panel-2: #22304a;
    --text: #f8fafc;
    --muted: #94a3b8;
    --red: #ef4444;
    --yellow: #facc15;
    --board: #2563eb;
    --empty: #e2e8f0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #18243a, var(--bg));
    color: var(--text);
    padding: 20px;
  }

  .app {
    width: min(760px, 100%);
    background: var(--panel);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }

  h1 {
    margin: 0 0 8px;
    text-align: center;
  }

  .subtitle {
    margin: 0 0 20px;
    text-align: center;
    color: var(--muted);
  }

  .status {
    text-align: center;
    font-weight: 700;
    margin-bottom: 16px;
    background: var(--panel-2);
    padding: 12px;
    border-radius: 10px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    background: var(--board);
    padding: 10px;
    border-radius: 14px;
  }

  .cell {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--empty);
    cursor: pointer;
    border: none;
    box-shadow: inset 0 3px 6px rgba(0,0,0,.25);
  }

  .cell:hover {
    filter: brightness(.95);
  }

  .cell.red { background: var(--red); }
  .cell.yellow { background: var(--yellow); }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 18px;
  }

  button.action {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-weight: 700;
    cursor: pointer;
  }

  #new-game {
    background: #38bdf8;
    color: #082f49;
  }

  @media (max-width: 520px) {
    .app { padding: 16px; }
    .board { gap: 5px; padding: 7px; }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Connect 4</h1>
    <p class="subtitle">You are Red. The computer is Yellow.</p>

    <div id="status" class="status">Your turn — click any column.</div>

    <div id="board" class="board"></div>

    <div class="controls">
      <button id="new-game" class="action">New Game</button>
    </div>
  </div>

<script>
  const ROWS = 6;
  const COLS = 7;
  const HUMAN = 1;
  const COMPUTER = 2;

  let board = [];
  let gameOver = false;

  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const newGameBtn = document.getElementById("new-game");

  function resetGame() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    gameOver = false;
    statusEl.textContent = "Your turn — click any column.";
    renderBoard();
  }

  function renderBoard() {
    boardEl.innerHTML = "";

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.setAttribute("aria-label", `Row ${r + 1}, Column ${c + 1}`);
        cell.dataset.col = c;

        if (board[r][c] === HUMAN) cell.classList.add("red");
        if (board[r][c] === COMPUTER) cell.classList.add("yellow");

        cell.addEventListener("click", () => handleHumanMove(c));
        boardEl.appendChild(cell);
      }
    }
  }

  function getOpenRow(col) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][col] === 0) return r;
    }
    return -1;
  }

  function handleHumanMove(col) {
    if (gameOver) return;

    const row = getOpenRow(col);
    if (row === -1) return;

    board[row][col] = HUMAN;
    renderBoard();

    if (checkWinner(HUMAN)) {
      gameOver = true;
      statusEl.textContent = "You win!";
      return;
    }

    if (isDraw()) {
      gameOver = true;
      statusEl.textContent = "It's a draw.";
      return;
    }

    statusEl.textContent = "Computer is thinking...";

    setTimeout(() => {
      computerMove();
    }, 400);
  }

  function computerMove() {
    if (gameOver) return;

    let col = findTacticalMove(COMPUTER);

    if (col === -1) {
      col = findTacticalMove(HUMAN);
    }

    if (col === -1 && getOpenRow(3) !== -1) {
      col = 3;
    }

    if (col === -1) {
      const openCols = [];
      for (let c = 0; c < COLS; c++) {
        if (getOpenRow(c) !== -1) openCols.push(c);
      }

      if (openCols.length === 0) return;
      col = openCols[Math.floor(Math.random() * openCols.length)];
    }

    const row = getOpenRow(col);
    board[row][col] = COMPUTER;
    renderBoard();

    if (checkWinner(COMPUTER)) {
      gameOver = true;
      statusEl.textContent = "Computer wins. Try again!";
      return;
    }

    if (isDraw()) {
      gameOver = true;
      statusEl.textContent = "It's a draw.";
      return;
    }

    statusEl.textContent = "Your turn — click any column.";
  }

  function findTacticalMove(player) {
    for (let c = 0; c < COLS; c++) {
      const r = getOpenRow(c);
      if (r === -1) continue;

      board[r][c] = player;
      const wins = checkWinner(player);
      board[r][c] = 0;

      if (wins) return c;
    }

    return -1;
  }

  function checkWinner(player) {
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (
          board[r][c] === player &&
          board[r][c + 1] === player &&
          board[r][c + 2] === player &&
          board[r][c + 3] === player
        ) return true;
      }
    }

    // Vertical
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r <= ROWS - 4; r++) {
        if (
          board[r][c] === player &&
          board[r + 1][c] === player &&
          board[r + 2][c] === player &&
          board[r + 3][c] === player
        ) return true;
      }
    }

    // Diagonal down-right
    for (let r = 0; r <= ROWS - 4; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (
          board[r][c] === player &&
          board[r + 1][c + 1] === player &&
          board[r + 2][c + 2] === player &&
          board[r + 3][c + 3] === player
        ) return true;
      }
    }

    // Diagonal up-right
    for (let r = 3; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (
          board[r][c] === player &&
          board[r - 1][c + 1] === player &&
          board[r - 2][c + 2] === player &&
          board[r - 3][c + 3] === player
        ) return true;
      }
    }

    return false;
  }

  function isDraw() {
    return board.every(row => row.every(cell => cell !== 0));
  }

  newGameBtn.addEventListener("click", resetGame);

  resetGame();
</script>
</body>
</html>
